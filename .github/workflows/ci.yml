name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marqova
          POSTGRES_PASSWORD: marqova
          POSTGRES_DB: marqova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marqova" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://marqova:marqova@localhost:5432/marqova
      AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      JOBS_SECRET: ci-jobs-secret
      PAYMENT_PROVIDERS: mock,cod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
